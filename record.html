<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Video Only Test</title>

<style>
body{
    font-family:Arial;
    padding:20px;
}

canvas{
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    margin-right:10px;
}
</style>
</head>
<body>

<h2>Canvas录制测试（仅录视频）</h2>

<canvas id="canvas" width="1280" height="720"></canvas>

<br><br>

<button id="startBtn">开始录制</button>
<button id="stopBtn">停止录制</button>

<br><br>

<audio
    id="audio"
    src="music.mp3"
    controls>
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const audioElement =
    document.getElementById("audio");

let recorder;
let chunks = [];

let x = 0;

function render(){

    ctx.fillStyle = "black";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "red";

    ctx.fillRect(
        x,
        300,
        120,
        120
    );

    ctx.fillStyle = "white";

    ctx.font = "60px Arial";

    ctx.fillText(
        new Date().toLocaleTimeString(),
        50,
        100
    );

    x += 5;

    if(x > canvas.width){
        x = -120;
    }

    requestAnimationFrame(render);
}

render();

document
.getElementById("startBtn")
.onclick = () => {

    chunks = [];

    // 只录视频
    const videoStream =
        canvas.captureStream(30);

    recorder =
        new MediaRecorder(
            videoStream,
            {
                mimeType:"video/webm"
            }
        );

    recorder.ondataavailable = (e)=>{

        if(e.data.size > 0){

            chunks.push(e.data);

        }
    };

    recorder.onstop = ()=>{

        const blob =
            new Blob(
                chunks,
                {
                    type:"video/webm"
                }
            );

        console.log(
            "文件大小(MB)：",
            (
                blob.size /
                1024 /
                1024
            ).toFixed(2)
        );

        const url =
            URL.createObjectURL(blob);

        // 页面预览
        const video =
            document.createElement("video");

        video.controls = true;
        video.style.width = "800px";
        video.src = url;

        document.body.appendChild(
            document.createElement("br")
        );

        document.body.appendChild(video);

        // 自动下载
        const a =
            document.createElement("a");

        a.href = url;
        a.download = "video_only.webm";
        a.click();
    };

    recorder.start();

    // 音乐照样播放
    audioElement.currentTime = 0;
    audioElement.play();

    console.log("开始录制");
};

document
.getElementById("stopBtn")
.onclick = ()=>{

    recorder.stop();

    audioElement.pause();

    console.log("停止录制");
};

</script>

</body>
</html>
