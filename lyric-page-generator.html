<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐视频生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }

    .app-container {
      display: flex;
      height: 100vh;
    }

    /* ========== 左侧控制面板 ========== */
    .control-panel {
      width: 380px;
      min-width: 380px;
      background: #222;
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
      border-right: 1px solid #333;
    }

    .control-panel h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #e8734a;
      border-left: 3px solid #e8734a;
      padding-left: 10px;
      letter-spacing: 1px;
    }

    .section {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section h3 {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: #1a1a1a;
      color: #e0e0e0;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #e8734a;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .file-input-wrapper input[type="file"] {
      width: 100%;
      font-size: 11px;
      color: #999;
    }

    .file-input-wrapper input[type="file"]::file-selector-button {
      background: #333;
      border: 1px solid #555;
      color: #ddd;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 8px;
    }

    .file-input-wrapper input[type="file"]::file-selector-button:hover {
      background: #e8734a;
      border-color: #e8734a;
      color: #fff;
    }

    .file-status {
      font-size: 11px;
      color: #4caf50;
      margin-top: 4px;
      display: none;
    }

    .file-status.show {
      display: block;
    }

    .hint {
      font-size: 10px;
      color: #666;
      margin-top: 3px;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker-row input[type="color"] {
      width: 32px;
      height: 32px;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 2px;
    }

    .size-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .size-preset {
      padding: 4px 10px;
      border: 1px solid #444;
      background: #1a1a1a;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      color: #999;
      transition: all 0.2s;
    }

    .size-preset:hover {
      border-color: #e8734a;
      color: #e8734a;
    }

    .size-preset.active {
      background: #e8734a;
      color: #fff;
      border-color: #e8734a;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .btn-preview {
      background: #333;
      color: #e8734a;
      border: 1px solid #e8734a;
    }

    .btn-preview:hover {
      background: #e8734a;
      color: #fff;
    }

    .btn-play {
      background: #4caf50;
      color: #fff;
    }

    .btn-play:hover {
      background: #45a049;
    }

    .btn-pause {
      background: #ff9800;
      color: #fff;
    }

    .btn-pause:hover {
      background: #f08900;
    }

    .btn-reset {
      background: #333;
      color: #999;
      border: 1px solid #555;
    }

    .btn-reset:hover {
      background: #444;
      color: #fff;
    }

    .btn-download {
      background: #e8734a;
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }

    .btn-download:hover {
      background: #d1653d;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }

    .status.success {
      display: block;
      background: #1a3a1a;
      color: #4caf50;
      border: 1px solid #2d5a2d;
    }

    .status.error {
      display: block;
      background: #3a1a1a;
      color: #f44336;
      border: 1px solid #5a2d2d;
    }

    .status.info {
      display: block;
      background: #1a2a3a;
      color: #64b5f6;
      border: 1px solid #2d405a;
    }

    /* ========== 右侧预览区 ========== */
    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .preview-container {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    /* 容器尺寸预设 */
    .preview-container.size-16-9 { width: 853px; height: 480px; }
    .preview-container.size-9-16 { width: 270px; height: 480px; }
    .preview-container.size-4-3 { width: 640px; height: 480px; }
    .preview-container.size-1-1 { width: 480px; height: 480px; }
    .preview-container.size-21-9 { width: 1120px; height: 480px; }
    .preview-container.size-custom { }

    .preview-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .preview-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .preview-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    .preview-title {
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .preview-subtitle {
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      margin-top: 6px;
    }

    .preview-credits {
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      margin-top: 8px;
      opacity: 0.85;
    }

    .preview-figure {
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-figure video,
    .preview-figure img {
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.4));
      max-width: 100%;
      max-height: 100%;
    }

    .preview-lyrics {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      max-height: 40%;
      overflow: hidden;
    }

    .preview-lyric-line {
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      opacity: 0.5;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .preview-lyric-line.active {
      opacity: 1;
      transform: scale(1.08);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .control-panel {
        width: 100%;
        min-width: auto;
        height: auto;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid #333;
      }
      .preview-area {
        flex: 1;
        min-height: 300px;
      }
      .preview-container.size-16-9 { width: 100%; height: auto; aspect-ratio: 16/9; }
      .preview-container.size-9-16 { width: auto; height: 100%; aspect-ratio: 9/16; }
      .preview-container.size-4-3 { width: 100%; height: auto; aspect-ratio: 4/3; }
      .preview-container.size-1-1 { width: 80%; height: auto; aspect-ratio: 1/1; }
      .preview-container.size-21-9 { width: 100%; height: auto; aspect-ratio: 21/9; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 左侧控制面板 -->
  <div class="control-panel">
    <h2>🎬 音乐视频生成器</h2>

    <!-- 播放控制 -->
    <div class="section">
      <h3>▶ 播放控制</h3>
      <div class="btn-group">
        <button class="btn btn-play" onclick="playPreview()">▶ 播放</button>
        <button class="btn btn-pause" onclick="pausePreview()">⏸ 暂停</button>
        <button class="btn btn-preview" onclick="updatePreview()">🔄 刷新预览</button>
      </div>
      <div class="hint" style="text-align:center;margin-top:8px;">
        当前时间: <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
      </div>
    </div>

    <!-- 容器尺寸 -->
    <div class="section">
      <h3>📐 视频容器尺寸</h3>
      <div class="size-presets" id="containerSizePresets">
        <button class="size-preset active" data-size="16-9">16:9 横屏</button>
        <button class="size-preset" data-size="9-16">9:16 竖屏</button>
        <button class="size-preset" data-size="4-3">4:3</button>
        <button class="size-preset" data-size="1-1">1:1 方形</button>
        <button class="size-preset" data-size="21-9">21:9 宽屏</button>
        <button class="size-preset" data-size="custom">自定义</button>
      </div>
      <div id="containerCustomSize" style="display:none; margin-top:8px;">
        <div class="form-row">
          <div class="form-group">
            <label>宽度 (px)</label>
            <input type="number" id="containerWidth" value="853" min="200" max="1920">
          </div>
          <div class="form-group">
            <label>高度 (px)</label>
            <input type="number" id="containerHeight" value="480" min="200" max="1920">
          </div>
        </div>
      </div>
    </div>

    <!-- 背景媒体 -->
    <div class="section">
      <h3>🖼️ 背景视频/图片</h3>
      <div class="form-group">
        <label>上传背景视频 (MP4)</label>
        <div class="file-input-wrapper">
          <input type="file" id="bgVideoFile" accept="video/mp4">
        </div>
        <div class="file-status" id="bgVideoFileStatus"></div>
      </div>
      <div class="form-group">
        <label>上传背景图片</label>
        <div class="file-input-wrapper">
          <input type="file" id="bgImageFile" accept="image/*">
        </div>
        <div class="file-status" id="bgImageFileStatus"></div>
      </div>
    </div>

    <!-- 蒙版设置 -->
    <div class="section">
      <h3>🎨 蒙版设置</h3>
      <div class="form-group">
        <label>蒙版颜色</label>
        <div class="color-picker-row">
          <input type="color" id="overlayColor" value="#000000">
          <input type="text" id="overlayColorText" value="#000000" style="flex:1;">
        </div>
      </div>
      <div class="form-group">
        <label>蒙版透明度: <span id="overlayOpacityValue">50%</span></label>
        <input type="range" id="overlayOpacity" min="0" max="100" value="50" style="width:100%;">
      </div>
    </div>

    <!-- 文字信息 -->
    <div class="section">
      <h3>📝 文字信息</h3>
      <div class="form-group">
        <label>歌名</label>
        <input type="text" id="songTitle" value="活该我盛开" placeholder="歌名">
      </div>
      <div class="form-group">
        <label>副标题</label>
        <input type="text" id="songSubtitle" value="" placeholder="可选副标题">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>词</label>
          <input type="text" id="creditsLyrics" value="山岭在逃" placeholder="作词">
        </div>
        <div class="form-group">
          <label>曲</label>
          <input type="text" id="creditsMusic" value="山岭在逃" placeholder="作曲">
        </div>
        <div class="form-group">
          <label>演</label>
          <input type="text" id="creditsArtist" value="" placeholder="演唱（可选）">
        </div>
      </div>
      <div class="form-group">
        <label>文字颜色</label>
        <div class="color-picker-row">
          <input type="color" id="textColor" value="#ffffff">
          <input type="text" id="textColorText" value="#ffffff" style="flex:1;">
        </div>
      </div>
      <div class="form-group">
        <label>歌名字号: <span id="titleFontSizeValue">28px</span></label>
        <input type="range" id="titleFontSize" min="16" max="72" value="28" style="width:100%;">
      </div>
      <div class="form-group">
        <label>其他文字字号: <span id="textFontSizeValue">14px</span></label>
        <input type="range" id="textFontSize" min="10" max="36" value="14" style="width:100%;">
      </div>
    </div>

    <!-- 人物媒体 -->
    <div class="section">
      <h3>👤 人物视频/图片</h3>
      <div class="form-group">
        <label>上传人物视频 (WebM/MP4)</label>
        <div class="file-input-wrapper">
          <input type="file" id="figureVideoFile" accept="video/webm,video/mp4">
        </div>
        <div class="file-status" id="figureVideoFileStatus"></div>
      </div>
      <div class="form-group">
        <label>上传人物图片</label>
        <div class="file-input-wrapper">
          <input type="file" id="figureImageFile" accept="image/*">
        </div>
        <div class="file-status" id="figureImageFileStatus"></div>
      </div>
      <div class="form-group">
        <label>人物尺寸</label>
        <div class="size-presets" id="figureSizePresets">
          <button class="size-preset active" data-figure-size="medium">中</button>
          <button class="size-preset" data-figure-size="small">小</button>
          <button class="size-preset" data-figure-size="large">大</button>
        </div>
      </div>
    </div>

    <!-- 歌词 -->
    <div class="section">
      <h3>🎤 歌词 (带时间戳)</h3>
      <div class="form-group">
        <label>格式: [分:秒.毫秒]歌词</label>
        <textarea id="lyricTimestamp" placeholder="[00:18.99]空心人 站进人海">[00:18.99]空心人 站进人海
[00:23.34]只剩九十斤的反骨 还在
[00:26.88]废墟里 排队等一个赦免
[00:30.72]等月光失约 才学会
[00:35.52]做自己的女娲 重塑这人间
[00:44.13]眼泪是大的海
[00:47.13]那就溺死 我的从前
[00:52.74]活该我盛开
[00:55.44]活该我 哭着哭着就笑出来
[00:61.35]活该我盛开
[00:64.05]活该我 偏偏要 嫁给自由 嫁给我的 不够乖</textarea>
      </div>
      <div class="form-group">
        <label>歌词可见行数: <span id="lyricVisibleLinesValue">5</span></label>
        <input type="range" id="lyricVisibleLines" min="3" max="11" value="5" step="2" style="width:100%;">
      </div>
      <div class="form-group">
        <label>歌词字号: <span id="lyricFontSizeValue">16px</span></label>
        <input type="range" id="lyricFontSize" min="10" max="32" value="16" style="width:100%;">
      </div>
    </div>

    <!-- 音频 -->
    <div class="section">
      <h3>🎵 音频</h3>
      <div class="form-group">
        <label>上传音频 (MP3/WAV)</label>
        <div class="file-input-wrapper">
          <input type="file" id="audioFile" accept="audio/mpeg,audio/mp3,audio/wav,audio/wave,audio/x-wav,audio/*">
        </div>
        <div class="file-status" id="audioFileStatus"></div>
      </div>
      <div class="form-group">
        <label>或音频外链 URL</label>
        <input type="text" id="audioUrl" placeholder="https://example.com/song.mp3">
      </div>
    </div>

    <!-- 操作按钮 -->
    <button class="btn btn-download" onclick="downloadPage()">⬇ 下载生成页面</button>
    <button class="btn btn-reset" onclick="resetForm()" style="width:100%; margin-top:6px;">🔄 恢复默认值</button>

    <div class="status" id="status"></div>

    <audio id="audioPlayer" style="display:none;"></audio>
  </div>

  <!-- 右侧预览区 -->
  <div class="preview-area" id="previewArea">
    <div class="preview-container size-16-9" id="previewContainer">
      <!-- 背景 -->
      <video class="preview-bg" id="previewBgVideo" style="display:none;" muted loop playsinline></video>
      <img class="preview-bg" id="previewBgImage" style="display:none;">
      <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:#1a1a2e;z-index:1;" id="previewBgFallback"></div>

      <!-- 蒙版 -->
      <div class="preview-overlay" id="previewOverlay"></div>

      <!-- 内容层 -->
      <div class="preview-content" id="previewContent">
        <!-- 歌名 -->
        <div class="preview-title" id="previewTitle">活该我盛开</div>
        <!-- 副标题 -->
        <div class="preview-subtitle" id="previewSubtitle" style="display:none;"></div>
        <!-- 创作者 -->
        <div class="preview-credits" id="previewCredits"></div>
        <!-- 人物 -->
        <div class="preview-figure" id="previewFigure">
          <video id="previewFigureVideo" style="display:none;" muted loop playsinline></video>
          <img id="previewFigureImage" style="display:none;">
        </div>
        <!-- 歌词 -->
        <div class="preview-lyrics" id="previewLyrics"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ========== 全局状态 ==========
  
  const fileBase64 = {
    bgVideo: null,
    bgImage: null,
    figureVideo: null,
    figureImage: null,
    audio: null
  };

  let audioElement = document.getElementById('audioPlayer');
  let parsedLyrics = [];
  let currentLyricIndex = -1;
  let isPlaying = false;
  let animationId = null;

  // 配置
  const config = {
    containerSize: '16-9',
    containerWidth: 853,
    containerHeight: 480,
    overlayColor: '#000000',
    overlayOpacity: 50,
    textColor: '#ffffff',
    titleFontSize: 28,
    textFontSize: 14,
    figureSize: 'medium',
    lyricVisibleLines: 5,
    lyricFontSize: 16
  };

  // 默认值
  const defaultValues = {
    songTitle: '活该我盛开',
    songSubtitle: '',
    creditsLyrics: '山岭在逃',
    creditsMusic: '山岭在逃',
    creditsArtist: '',
    lyricTimestamp: document.getElementById('lyricTimestamp').value
  };

  // ========== 文件处理 ==========
  
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, mimeType: file.type, fileName: file.name, size: file.size });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function handleFileUpload(inputId, statusId, key) {
    const input = document.getElementById(inputId);
    const statusEl = document.getElementById(statusId);
    
    input.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      statusEl.textContent = '⏳ 处理中...';
      statusEl.className = 'file-status show';
      
      try {
        const data = await fileToBase64(file);
        fileBase64[key] = data;
        
        // 如果是音频，加载到播放器
        if (key === 'audio') {
          audioElement.src = data.dataUrl;
          audioElement.load();
        }
        
        // 如果是背景视频，设置到预览
        if (key === 'bgVideo') {
          const el = document.getElementById('previewBgVideo');
          el.src = data.dataUrl;
          el.style.display = 'block';
          document.getElementById('previewBgImage').style.display = 'none';
          document.getElementById('previewBgFallback').style.display = 'none';
        }
        
        // 如果是背景图片
        if (key === 'bgImage') {
          const el = document.getElementById('previewBgImage');
          el.src = data.dataUrl;
          el.style.display = 'block';
          document.getElementById('previewBgVideo').style.display = 'none';
          document.getElementById('previewBgFallback').style.display = 'none';
        }
        
        // 如果是人物视频
        if (key === 'figureVideo') {
          const el = document.getElementById('previewFigureVideo');
          el.src = data.dataUrl;
          el.style.display = 'block';
          document.getElementById('previewFigureImage').style.display = 'none';
        }
        
        // 如果是人物图片
        if (key === 'figureImage') {

  // ========== 解析歌词 ==========
  
  function parseLyrics() {
    const text = document.getElementById('lyricTimestamp').value;
    const lines = text.split('\n').filter(line => line.trim());
    parsedLyrics = [];
    const regex = /\[(\d+):(\d+)\.(\d+)\](.*)/;
    
    lines.forEach(line => {
      const match = line.match(regex);
      if (match) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = parseInt(match[3]);
        const time = min * 60 + sec + ms / 1000;
        const txt = match[4].trim();
        if (txt) parsedLyrics.push({ time, text: txt });
      }
    });
  }

  function getVisibleLyrics(currentTime) {
    if (!parsedLyrics.length) return { lines: [], activeIndex: -1 };
    
    let activeIndex = -1;
    for (let i = parsedLyrics.length - 1; i >= 0; i--) {
      if (currentTime >= parsedLyrics[i].time) {
        activeIndex = i;
        break;
      }
    }
    
    const half = Math.floor(config.lyricVisibleLines / 2);
    let start = Math.max(0, activeIndex - half);
    let end = Math.min(parsedLyrics.length, start + config.lyricVisibleLines);
    
    if (end - start < config.lyricVisibleLines) {
      start = Math.max(0, end - config.lyricVisibleLines);
    }
    
    const lines = parsedLyrics.slice(start, end).map((l, i) => ({
      ...l,
      isActive: (start + i) === activeIndex
    }));
    
    return { lines, activeIndex: activeIndex - start };
  }

  function updateLyricDisplay() {
    const currentTime = audioElement.currentTime || 0;
    const { lines } = getVisibleLyrics(currentTime);
    
    const container = document.getElementById('previewLyrics');
    container.innerHTML = '';
    
    lines.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'preview-lyric-line' + (line.isActive ? ' active' : '');
      div.textContent = line.text;
      div.style.color = config.textColor;
      div.style.fontSize = config.lyricFontSize + 'px';
      container.appendChild(div);
    });
  }

      return;
    }
    
    audioElement.play().then(() => {
      isPlaying = true;
      document.getElementById('previewBgVideo')?.play().catch(() => {});
      document.getElementById('previewFigureVideo')?.play().catch(() => {});
      startTimeUpdate();
      showStatus('success', '▶ 正在播放');
    }).catch(err => {
      showStatus('error', '❌ 播放失败: ' + err.message);
    });
  }

  function pausePreview() {
    audioElement.pause();
    isPlaying = false;
    document.getElementById('previewBgVideo')?.pause();
    document.getElementById('previewFigureVideo')?.pause();
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    showStatus('info', '⏸ 已暂停');
  }

  function startTimeUpdate() {
    function update() {
      if (!isPlaying) return;
      
      const t = audioElement.currentTime;
      const total = audioElement.duration || 0;
      
      document.getElementById('currentTime').textContent = formatTime(t);
      document.getElementById('totalTime').textContent = formatTime(total);
      
      updateLyricDisplay();
      
      animationId = requestAnimationFrame(update);
    }
    
    update();
  }

  function formatTime(seconds) {
    if (isNaN(seconds)) return '00:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  audioElement.addEventListener('loadedmetadata', function() {
    document.getElementById('totalTime').textContent = formatTime(audioElement.duration);

    };

    a.download = (document.getElementById('songTitle').value || '音乐视频') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

  }

      var end = Math.min(lyrics.length, start + visibleLines);
      if (end-start < visibleLines) start = Math.max(0, end - visibleLines);
      return { lines: lyrics.slice(start,end), activeIdx: active - start };
    }
    
    function updateLyrics() {
      if (!audio) return;
      var ct = audio.currentTime;
      var result = getVisibleLyrics(ct);
      var container = document.getElementById('mvLyrics');
      container.innerHTML = '';
      result.lines.forEach(function(l, i) {
        var d = document.createElement('div');
        d.className = 'mv-lyric-line' + (i===result.activeIdx ? ' active' : '');
        d.textContent = l.text;
        d.addEventListener('click', function() {
          if (audio) { audio.currentTime = l.time; updateLyrics(); }
        });
        container.appendChild(d);
      });
    }
    
    if (audio) {
      audio.addEventListener('timeupdate', updateLyrics);
      audio.addEventListener('play', function() {
        document.querySelector('.bg-media')?.play();
        document.querySelector('.mv-figure video')?.play();
      });
      audio.addEventListener('pause', function() {
        document.querySelector('.bg-media')?.pause();
        document.querySelector('.mv-figure video')?.pause();
      });
      updateLyrics();
    }
    
    document.addEventListener('click', function() {
      if (audio && audio.paused) {
        audio.play().catch(function(){});
      }
    }, { once: true });
  })();
<\/script>
</body>
</html>`;
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  // ========== 初始化 ==========
  
  window.addEventListener('load', () => {
    updatePreview();
  });
</script>
