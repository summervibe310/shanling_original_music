<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐视频生成器 - 修复进度条</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  
  <!-- FFmpeg WebAssembly -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; overflow: hidden; height: 100vh; }
    .app-container { display: flex; height: 100vh; }
    
    /* 录制进度弹窗 */
    .recording-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; display: flex; align-items: center; justify-content: center; }
    .recording-modal { background: #1e1e1e; border: 2px solid #e8734a; border-radius: 16px; padding: 32px; text-align: center; max-width: 420px; width: 90%; }
    .recording-modal h3 { color: #fff; font-size: 18px; margin-bottom: 8px; }
    .recording-modal .recording-icon { font-size: 40px; margin-bottom: 12px; }
    .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 16px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #e8734a; border-radius: 3px; transition: width 0.3s; }
    .progress-text { color: #aaa; font-size: 12px; }
    .processing-text { color: #ffd700; font-size: 12px; margin-top: 8px; display: none; }
    .btn-cancel { background: #333; color: #ccc; border: 1px solid #555; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 12px; }
    .btn-cancel:hover { background: #e8734a; color: #fff; border-color: #e8734a; }
    
    /* 左侧面板 */
    .control-panel { width: 380px; min-width: 380px; background: #222; padding: 20px; overflow-y: auto; height: 100vh; border-right: 1px solid #333; }
    .control-panel h2 { font-size: 18px; margin-bottom: 20px; color: #e8734a; border-left: 3px solid #e8734a; padding-left: 10px; }
    .section { background: #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .section h3 { font-size: 13px; color: #ccc; margin-bottom: 12px; text-transform: uppercase; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group textarea, .form-group select { 
      width: 100%; padding: 8px 10px; border: 1px solid #444; border-radius: 6px; font-size: 13px; 
      font-family: inherit; background: #1a1a1a; color: #e0e0e0; 
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #e8734a; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    
    .file-input-wrapper input[type="file"] { width: 100%; font-size: 11px; color: #999; }
    .file-input-wrapper input[type="file"]::file-selector-button { 
      background: #333; border: 1px solid #555; color: #ddd; padding: 6px 12px; 
      border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 8px; 
    }
    .file-input-wrapper input[type="file"]::file-selector-button:hover { background: #e8734a; border-color: #e8734a; color: #fff; }
    .file-status { font-size: 11px; color: #4caf50; margin-top: 4px; display: none; } 
    .file-status.show { display: block; }
    .hint { font-size: 10px; color: #666; margin-top: 3px; }
    
    .color-picker-row { display: flex; align-items: center; gap: 8px; }
    .color-picker-row input[type="color"] { width: 32px; height: 32px; border: 1px solid #444; border-radius: 4px; cursor: pointer; background: transparent; padding: 2px; }
    
    .size-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .size-preset { padding: 4px 10px; border: 1px solid #444; background: #1a1a1a; border-radius: 4px; font-size: 10px; cursor: pointer; color: #999; transition: all 0.2s; }
    .size-preset:hover { border-color: #e8734a; color: #e8734a; } 
    .size-preset.active { background: #e8734a; color: #fff; border-color: #e8734a; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .btn-play { background: #4caf50; color: #fff; } .btn-play:hover { background: #45a049; }
    .btn-pause { background: #ff9800; color: #fff; } .btn-pause:hover { background: #f08900; }
    .btn-refresh { background: #333; color: #e8734a; border: 1px solid #e8734a; } .btn-refresh:hover { background: #e8734a; color: #fff; }
    .btn-download { background: #e8734a; color: #fff; width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; } 
    .btn-download:hover { background: #d1653d; }
    .btn-download:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-reset { background: #333; color: #999; border: 1px solid #555; width: 100%; margin-top: 6px; } 
    .btn-reset:hover { background: #444; color: #fff; }
    
    .status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 11px; text-align: center; display: none; }
    .status.success { display: block; background: #1a3a1a; color: #4caf50; border: 1px solid #2d5a2d; }
    .status.error { display: block; background: #3a1a1a; color: #f44336; border: 1px solid #5a2d2d; }
    .status.info { display: block; background: #1a2a3a; color: #64b5f6; border: 1px solid #2d405a; }
    .status.warning { display: block; background: #3a3a1a; color: #ffd700; border: 1px solid #5a5a2d; }
    
    .audio-seek-container { margin-top: 12px; }
    .audio-seek-container input[type="range"] { width: 100%; accent-color: #e8734a; cursor: pointer; }
    .audio-time-labels { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: 2px; }
    
    /* 预览区域 */
    .preview-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; overflow: hidden; }
    .preview-wrapper { position: relative; transform-origin: center center; transition: transform 0.15s ease-out; }
    .preview-container { position: relative; overflow: hidden; background: #111; }
    .preview-container.size-16-9 { width: 853px; height: 480px; } 
    .preview-container.size-9-16 { width: 270px; height: 480px; }
    .preview-container.size-4-3 { width: 640px; height: 480px; } 
    .preview-container.size-1-1 { width: 480px; height: 480px; }
    .preview-container.size-21-9 { width: 1120px; height: 480px; } 
    .preview-container.size-custom { }
    
    .preview-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .preview-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
    .preview-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
    .preview-title { font-weight: bold; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .preview-subtitle { text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,0.5); margin-top: 6px; }
    .preview-credits { text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.5); margin-top: 8px; opacity: 0.85; }
    .preview-figure { margin: 10px 0; display: flex; align-items: center; justify-content: center; }
    .preview-figure video, .preview-figure img { object-fit: contain; filter: drop-shadow(0 0 20px rgba(0,0,0,0.4)); max-width: 100%; max-height: 100%; }
    .preview-lyrics { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 8px; max-height: 40%; overflow: hidden; }
    .preview-lyric-line { text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.6); transition: all 0.3s ease; opacity: 0.5; white-space: nowrap; cursor: pointer; pointer-events: auto; }
    .preview-lyric-line.active { opacity: 1; transform: scale(1.08); }
    
    .zoom-control { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; z-index: 100; backdrop-filter: blur(8px); }
    .zoom-control input[type="range"] { width: 150px; accent-color: #e8734a; cursor: pointer; }
    .zoom-control .zoom-value { font-size: 11px; color: #e8734a; font-weight: bold; min-width: 36px; text-align: center; }
    .zoom-control .zoom-btn { background: #444; border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: background 0.2s; }
    .zoom-control .zoom-btn:hover { background: #e8734a; }
    .zoom-control .zoom-fit { background: #333; border: 1px solid #555; color: #ccc; padding: 4px 10px; border-radius: 10px; cursor: pointer; font-size: 10px; transition: all 0.2s; white-space: nowrap; }
    .zoom-control .zoom-fit:hover { background: #e8734a; border-color: #e8734a; color: #fff; }
    
    @media (max-width: 900px) { 
      .app-container { flex-direction: column; } 
      .control-panel { width: 100%; min-width: auto; height: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid #333; } 
      .preview-area { flex: 1; min-height: 300px; } 
    }
  </style>
</head>
<body>

<!-- 录制进度弹窗 -->
<div class="recording-modal-overlay" id="recordingModal" style="display:none;">
  <div class="recording-modal">
    <div class="recording-icon" id="recordingIcon">🔴</div>
    <h3 id="recordingTitle">正在录制视频...</h3>
    <div class="progress-bar"><div class="progress-fill" id="recordingProgressFill"></div></div>
    <div class="progress-text" id="recordingProgressText">0%</div>
    <div class="processing-text" id="processingText">⏳ 正在处理视频文件，请稍候...</div>
    <button class="btn-cancel" id="cancelBtn" onclick="cancelRecording()">取消录制</button>
  </div>
</div>

<div class="app-container">
  <div class="control-panel">
    <h2>🎬 音乐视频生成器</h2>

    <div class="section">
      <h3>▶ 播放控制</h3>
      <div class="btn-group">
        <button class="btn btn-play" onclick="playPreview()">▶ 播放</button>
        <button class="btn btn-pause" onclick="pausePreview()">⏸ 暂停</button>
        <button class="btn btn-refresh" onclick="updatePreview()">🔄 刷新</button>
      </div>
      <div class="audio-seek-container">
        <input type="range" id="audioSeekBar" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)">
        <div class="audio-time-labels">
          <span id="currentTime">00:00</span>
          <span id="totalTime">00:00</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>📐 视频尺寸</h3>
      <div class="size-presets" id="containerSizePresets">
        <button class="size-preset active" data-size="16-9">16:9</button>
        <button class="size-preset" data-size="9-16">9:16</button>
        <button class="size-preset" data-size="4-3">4:3</button>
        <button class="size-preset" data-size="1-1">1:1</button>
        <button class="size-preset" data-size="21-9">21:9</button>
        <button class="size-preset" data-size="custom">自定义</button>
      </div>
      <div id="containerCustomSize" style="display:none; margin-top:8px;">
        <div class="form-row">
          <div class="form-group"><label>宽度 (px)</label><input type="number" id="containerWidth" value="853" min="100" max="7680"></div>
          <div class="form-group"><label>高度 (px)</label><input type="number" id="containerHeight" value="480" min="100" max="4320"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>🖼️ 背景</h3>
      <div class="form-group">
        <label>背景视频 (WebM/MP4)</label>
        <div class="file-input-wrapper"><input type="file" id="bgVideoFile" accept="video/webm,video/mp4"></div>
        <div class="file-status" id="bgVideoFileStatus"></div>
      </div>
      <div class="form-group">
        <label>背景图片</label>
        <div class="file-input-wrapper"><input type="file" id="bgImageFile" accept="image/*"></div>
        <div class="file-status" id="bgImageFileStatus"></div>
      </div>
    </div>

    <div class="section">
      <h3>🎵 音频</h3>
      <div class="form-group">
        <label>上传音频 (MP3/WAV)</label>
        <div class="file-input-wrapper"><input type="file" id="audioFile" accept="audio/*"></div>
        <div class="file-status" id="audioFileStatus"></div>
      </div>
      <div class="form-group">
        <label>音频外链 URL</label>
        <input type="text" id="audioUrl" placeholder="https://example.com/song.mp3">
      </div>
    </div>

    <div class="section">
      <h3>📝 文字</h3>
      <div class="form-group"><label>歌名</label><input type="text" id="songTitle" value="活该我盛开"></div>
      <div class="form-row">
        <div class="form-group"><label>词</label><input type="text" id="creditsLyrics" value="山岭在逃"></div>
        <div class="form-group"><label>曲</label><input type="text" id="creditsMusic" value="山岭在逃"></div>
      </div>
    </div>

    <div class="section">
      <h3>🎤 歌词</h3>
      <div class="form-group">
        <label>LRC 格式歌词</label>
        <textarea id="lyricTimestamp">[00:18.99]空心人 站进人海
[00:23.34]只剩九十斤的反骨 还在
[00:26.88]废墟里 排队等一个赦免
[00:30.72]等月光失约 才学会
[00:35.52]做自己的女娲 重塑这人间</textarea>
      </div>
    </div>

    <button class="btn btn-download" id="downloadBtn" onclick="startRecording()">
      ⬇ 导出视频 (支持拖动进度条)
    </button>
    <button class="btn btn-reset" onclick="resetForm()">🔄 恢复默认值</button>
    <div class="status" id="status"></div>
    <audio id="audioPlayer" style="display:none;"></audio>
  </div>

  <!-- 预览区 -->
  <div class="preview-area" id="previewArea">
    <div class="preview-wrapper" id="previewWrapper">
      <div class="preview-container size-16-9" id="previewContainer">
        <video class="preview-bg" id="previewBgVideo" style="display:none;" muted loop playsinline></video>
        <img class="preview-bg" id="previewBgImage" style="display:none;">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:#1a1a2e;z-index:1;" id="previewBgFallback"></div>
        <div class="preview-overlay" id="previewOverlay"></div>
        <div class="preview-content" id="previewContent">
          <div class="preview-title" id="previewTitle">活该我盛开</div>
          <div class="preview-credits" id="previewCredits"></div>
          <div class="preview-figure" id="previewFigure">
            <video id="previewFigureVideo" style="display:none;" muted loop playsinline></video>
            <img id="previewFigureImage" style="display:none;">
          </div>
          <div class="preview-lyrics" id="previewLyrics"></div>
        </div>
      </div>
    </div>
    <div class="zoom-control" id="zoomControl">
      <button class="zoom-btn" onclick="zoomOut()">−</button>
      <input type="range" id="zoomSlider" min="15" max="200" value="100" step="1">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <span class="zoom-value" id="zoomValue">100%</span>
      <button class="zoom-fit" onclick="fitToScreen()">适配窗口</button>
    </div>
  </div>
</div>

<script>
// ========== 全局变量 ==========
const fileBase64 = { bgVideo: null, bgImage: null, figureVideo: null, figureImage: null, audio: null };
let audioElement = document.getElementById('audioPlayer');
let parsedLyrics = [];
let isPlaying = false;
let animationId = null;
let currentZoom = 100;
let mediaRecorder = null;
let recordingChunks = [];
let recordingCanvas = null;
let recordingCtx = null;
let recordingDuration = 0;
let recordingAnimationId = null;
let isRecording = false;
let ffmpeg = null;

// ========== FFmpeg 初始化 ==========
async function initFFmpeg() {
  if (ffmpeg) return ffmpeg;
  
  try {
    const { FFmpeg } = window;
    ffmpeg = new FFmpeg();
    
    ffmpeg.on('log', ({ message }) => {
      console.log('[FFmpeg]', message);
    });
    
    await ffmpeg.load({
      coreURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
    });
    
    console.log('✅ FFmpeg 初始化成功');
    return ffmpeg;
  } catch (error) {
    console.error('❌ FFmpeg 初始化失败:', error);
    return null;
  }
}

// ========== 修复 WebM - 使其可拖动进度条 ==========
async function fixWebM(webmBlob) {
  const ff = await initFFmpeg();
  if (!ff) {
    console.warn('FFmpeg 不可用，WebM 进度条可能无法拖动');
    return webmBlob;
  }
  
  try {
    console.log('🔧 正在修复 WebM，添加索引元数据...');
    
    // 写入输入文件
    const arrayBuffer = await webmBlob.arrayBuffer();
    await ff.writeFile('input.webm', new Uint8Array(arrayBuffer));
    
    // 关键：使用 webm_chunk 复用器重新封装，添加 cues
    // -c copy 表示不重新编码，只重新封装
    // -fflags +genpts 生成时间戳
    // -reset_timestamps 1 重置时间戳从0开始
    await ff.exec([
      '-i', 'input.webm',
      '-c', 'copy',
      '-fflags', '+genpts',
      '-reset_timestamps', '1',
      '-map', '0',
      'output.webm'
    ]);
    
    // 读取输出
    const outputData = await ff.readFile('output.webm');
    const fixedBlob = new Blob([outputData.buffer], { type: 'video/webm' });
    
    // 清理
    await ff.deleteFile('input.webm');
    await ff.deleteFile('output.webm');
    
    console.log('✅ WebM 修复完成，已添加索引');
    return fixedBlob;
  } catch (error) {
    console.error('WebM 修复失败:', error);
    return webmBlob;
  }
}

// ========== 获取容器尺寸 ==========
function getContainerSize() {
  const c = document.getElementById('previewContainer');
  return { width: c.offsetWidth, height: c.offsetHeight };
}

// ========== 音频滑轨 ==========
function seekAudio(value) {
  if (!audioElement.src) return;
  const duration = audioElement.duration || 0;
  if (duration > 0) { 
    audioElement.currentTime = (value / 100) * duration; 
    updateLyricDisplay(); 
  }
}

audioElement.addEventListener('timeupdate', function() {
  if (isRecording) return;
  const duration = audioElement.duration || 0;
  if (duration > 0) {
    document.getElementById('audioSeekBar').value = (audioElement.currentTime / duration) * 100;
    document.getElementById('currentTime').textContent = formatTime(audioElement.currentTime);
  }
});

audioElement.addEventListener('loadedmetadata', function() {
  document.getElementById('totalTime').textContent = formatTime(audioElement.duration);
});

function formatTime(s) {
  if (isNaN(s)) return '00:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ========== 缩放 ==========
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const previewWrapper = document.getElementById('previewWrapper');
const previewArea = document.getElementById('previewArea');

function applyZoom(z) {
  currentZoom = Math.max(15, Math.min(200, z));
  zoomSlider.value = currentZoom;
  zoomValue.textContent = currentZoom + '%';
  previewWrapper.style.transform = `scale(${currentZoom/100})`;
}

zoomSlider.addEventListener('input', function() { applyZoom(parseInt(this.value)); });
function zoomIn() { applyZoom(currentZoom + 10); }
function zoomOut() { applyZoom(currentZoom - 10); }

function fitToScreen() {
  const c = document.getElementById('previewContainer');
  const ax = previewArea.clientWidth - 40;
  const ay = previewArea.clientHeight - 80;
  applyZoom(Math.floor(Math.min(ax/c.offsetWidth, ay/c.offsetHeight, 1) * 100));
}

window.addEventListener('resize', () => { setTimeout(fitToScreen, 300); });
previewArea.addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    applyZoom(currentZoom + (e.deltaY < 0 ? 5 : -5));
  }
}, { passive: false });

// ========== 文件处理 ==========
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ dataUrl: r.result, mimeType: file.type, fileName: file.name, size: file.size });
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function formatFileSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

async function handleFileUpload(inputId, statusId, key) {
  const input = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  
  input.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    status.textContent = '⏳ 处理中...';
    status.className = 'file-status show';
    
    try {
      const data = await fileToBase64(file);
      fileBase64[key] = data;
      
      if (key === 'audio') {
        audioElement.src = data.dataUrl;
        audioElement.load();
        document.getElementById('audioSeekBar').value = 0;
        document.getElementById('currentTime').textContent = '00:00';
      }
      if (key === 'bgVideo') {
        const el = document.getElementById('previewBgVideo');
        el.src = data.dataUrl;
        el.style.display = 'block';
        document.getElementById('previewBgImage').style.display = 'none';
        document.getElementById('previewBgFallback').style.display = 'none';
      }
      if (key === 'bgImage') {
        const el = document.getElementById('previewBgImage');
        el.src = data.dataUrl;
        el.style.display = 'block';
        document.getElementById('previewBgVideo').style.display = 'none';
        document.getElementById('previewBgFallback').style.display = 'none';
      }
      if (key === 'figureVideo') {
        const el = document.getElementById('previewFigureVideo');
        el.src = data.dataUrl;
        el.style.display = 'block';
        document.getElementById('previewFigureImage').style.display = 'none';
      }
      if (key === 'figureImage') {
        const el = document.getElementById('previewFigureImage');
        el.src = data.dataUrl;
        el.style.display = 'block';
        document.getElementById('previewFigureVideo').style.display = 'none';
      }
      
      status.textContent = '✅ ' + file.name + ' (' + formatFileSize(file.size) + ')';
      status.className = 'file-status show';
      status.style.color = '#4caf50';
      updatePreview();
    } catch (err) {
      status.textContent = '❌ 处理失败';
      status.className = 'file-status show';
      status.style.color = '#f44336';
    }
  });
}

document.getElementById('overlayColor').addEventListener('input', function() {

document.getElementById('overlayOpacity').addEventListener('input', function() {

function updateOverlay() {
  const color = document.getElementById('overlayColor').value;
  const opacity = document.getElementById('overlayOpacity').value / 100;
  document.getElementById('previewOverlay').style.backgroundColor = 
    `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${opacity})`;

// ========== 文字更新 ==========
function updateTextContent() {
  document.getElementById('previewTitle').textContent = document.getElementById('songTitle').value || '歌名';
  const lyr = document.getElementById('creditsLyrics').value;
  const mus = document.getElementById('creditsMusic').value;
  let credits = '';
  if (lyr) credits += '词：' + lyr;
  if (mus) credits += (credits ? '  ' : '') + '曲：' + mus;
  document.getElementById('previewCredits').textContent = credits;
}

// ========== 歌词 ==========
function parseLyrics() {
  const text = document.getElementById('lyricTimestamp').value;
  const lines = text.split('\n').filter(l => l.trim());
  parsedLyrics = [];
  const regex = /\[(\d+):(\d+)\.(\d+)\](.*)/;
  
  lines.forEach(l => {
    const match = l.match(regex);
    if (match) {
      const time = parseInt(match[1]) * 60 + parseInt(match[2]) + parseInt(match[3]) / 1000;
      const text = match[4].trim();
      if (text) parsedLyrics.push({ time, text });
    }
  });
}

function getVisibleLyrics(currentTime) {
  if (!parsedLyrics.length) return { lines: [], activeIndex: -1 };
  
  let activeIndex = -1;
  for (let i = parsedLyrics.length - 1; i >= 0; i--) {
    if (currentTime >= parsedLyrics[i].time) {
      activeIndex = i;
      break;
    }
  }
  
  const halfVisible = 2;
  let start = Math.max(0, activeIndex - halfVisible);
  let end = Math.min(parsedLyrics.length, start + 5);
  if (end - start < 5) start = Math.max(0, end - 5);
  
  return {
    lines: parsedLyrics.slice(start, end).map((l, i) => ({
      ...l,
      isActive: (start + i) === activeIndex
    })),
    activeIndex: activeIndex - start
  };
}

function updateLyricDisplay() {
  const currentTime = audioElement.currentTime || 0;
  const { lines } = getVisibleLyrics(currentTime);
  const container = document.getElementById('previewLyrics');
  container.innerHTML = '';
  
  lines.forEach(l => {
    const div = document.createElement('div');
    div.className = 'preview-lyric-line' + (l.isActive ? ' active' : '');
    div.textContent = l.text;
    div.style.color = l.isActive ? '#ffd700' : '#ffffff';
    container.appendChild(div);
  });
}

function updatePreview() {
  parseLyrics();
  updateOverlay();
  updateTextContent();
  updateLyricDisplay();
}

// ========== 播放控制 ==========
function playPreview() {
  if (!audioElement.src) {
    showStatus('error', '❌ 请先上传音频');
    return;
  }
  
  audioElement.play().then(() => {
    isPlaying = true;
    document.getElementById('previewBgVideo')?.play().catch(() => {});
    document.getElementById('previewFigureVideo')?.play().catch(() => {});
    startTimeUpdate();
  }).catch(err => showStatus('error', '❌ ' + err.message));
}

function pausePreview() {
  audioElement.pause();
  isPlaying = false;
  document.getElementById('previewBgVideo')?.pause();
  document.getElementById('previewFigureVideo')?.pause();
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
}

function startTimeUpdate() {
  function update() {
    if (!isPlaying) return;
    const t = audioElement.currentTime;
    const d = audioElement.duration || 0;
    if (d > 0) {
      document.getElementById('audioSeekBar').value = (t / d) * 100;
    }
    document.getElementById('currentTime').textContent = formatTime(t);
    updateLyricDisplay();
    animationId = requestAnimationFrame(update);
  }
  update();
}

audioElement.addEventListener('ended', () => {
  isPlaying = false;
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  document.getElementById('audioSeekBar').value = 100;
});

document.getElementById('previewLyrics').addEventListener('click', function(e) {
  const line = e.target.closest('.preview-lyric-line');
  if (!line || !parsedLyrics.length) return;
  const found = parsedLyrics.find(l => l.text === line.textContent);
  if (found) {
    audioElement.currentTime = found.time;
    updateLyricDisplay();
  }
});

document.getElementById('audioUrl').addEventListener('input', function() {
  if (this.value && !fileBase64.audio) {
    audioElement.src = this.value;
    audioElement.load();
  }
});

function showStatus(type, msg) {
  const s = document.getElementById('status');
  s.className = 'status ' + type;
  s.textContent = msg;
  s.style.display = 'block';
  setTimeout(() => s.style.display = 'none', 5000);
}

// ========== 录制视频 ==========
async function startRecording() {
  if (!audioElement.src) { showStatus('error', '❌ 请先上传音频'); return; }
  if (isRecording) return;
  
  const size = getContainerSize();
  const maxDim = 1920;
  let rw = size.width, rh = size.height;
  if (size.width > maxDim || size.height > maxDim) {
    const scale = Math.min(maxDim / size.width, maxDim / size.height);
    rw = Math.floor(size.width * scale);
    rh = Math.floor(size.height * scale);
  }
  
  // 创建录制画布
  recordingCanvas = document.createElement('canvas');
  recordingCanvas.width = rw;
  recordingCanvas.height = rh;
  recordingCtx = recordingCanvas.getContext('2d');
  
  // 准备图片元素
  const bgVideo = document.getElementById('previewBgVideo');
  const bgImage = document.getElementById('previewBgImage');
  const figureVideo = document.getElementById('previewFigureVideo');
  const figureImage = document.getElementById('previewFigureImage');
  
  let bgImgElement = null, fgImgElement = null;
  if (fileBase64.bgImage && bgImage.style.display !== 'none') {
    bgImgElement = new Image();
    bgImgElement.src = fileBase64.bgImage.dataUrl;
    await new Promise(r => { bgImgElement.onload = r; });
  }
  if (fileBase64.figureImage && figureImage.style.display !== 'none') {
    fgImgElement = new Image();
    fgImgElement.src = fileBase64.figureImage.dataUrl;
    await new Promise(r => { fgImgElement.onload = r; });
  }
  
  // 创建录制流
  const canvasStream = recordingCanvas.captureStream(30);
  const audioStream = audioElement.captureStream ? audioElement.captureStream() : null;
  let combinedStream;
  if (audioStream && audioStream.getAudioTracks().length > 0) {
    combinedStream = new MediaStream([canvasStream.getVideoTracks()[0], audioStream.getAudioTracks()[0]]);
  } else {
    combinedStream = canvasStream;
  }
  
  // 检查支持的 MIME 类型
  const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  let selectedMime = '';
  for (const mt of mimeTypes) {
    if (MediaRecorder.isTypeSupported(mt)) {
      selectedMime = mt;
      break;
    }
  }
  if (!selectedMime) { showStatus('error', '❌ 浏览器不支持录制'); return; }
  
  // 创建 MediaRecorder
  recordingChunks = [];
  mediaRecorder = new MediaRecorder(combinedStream, { 
    mimeType: selectedMime, 
    videoBitsPerSecond: 5000000 
  });
  
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordingChunks.push(e.data);
  };
  
  mediaRecorder.onstop = async () => {
    // 显示处理中
    document.getElementById('processingText').style.display = 'block';
    document.getElementById('recordingIcon').textContent = '🔧';
    document.getElementById('recordingTitle').textContent = '正在修复视频文件...';
    document.getElementById('cancelBtn').style.display = 'none';
    
    try {
      // 创建原始 WebM Blob
      const rawBlob = new Blob(recordingChunks, { type: selectedMime });
      
      // 使用 FFmpeg 修复 WebM（添加索引元数据）
      const fixedBlob = await fixWebM(rawBlob);
      
      // 下载
      const fileName = (document.getElementById('songTitle').value || '音乐视频') + '.webm';
      const url = URL.createObjectURL(fixedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      
      showStatus('success', `✅ 导出成功！(${formatFileSize(fixedBlob.size)}) - 支持拖动进度条`);
    } catch (error) {
      console.error('处理失败:', error);
      showStatus('error', '❌ 视频处理失败，请重试');
    }
    
    // 恢复 UI
    document.getElementById('recordingModal').style.display = 'none';
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('processingText').style.display = 'none';
    document.getElementById('recordingIcon').textContent = '🔴';
    document.getElementById('recordingTitle').textContent = '正在录制视频...';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    isRecording = false;
  };
  
  // 显示录制弹窗
  document.getElementById('recordingModal').style.display = 'flex';
  document.getElementById('downloadBtn').disabled = true;
  isRecording = true;
  
  // 重置所有媒体
  audioElement.currentTime = 0;
  if (bgVideo.style.display !== 'none') bgVideo.currentTime = 0;
  if (figureVideo.style.display !== 'none') figureVideo.currentTime = 0;
  recordingDuration = audioElement.duration || 60;
  
  // 开始录制
  mediaRecorder.start(100);
  
  // 开始播放
  await audioElement.play().catch(() => {});
  if (bgVideo.style.display !== 'none') bgVideo.play().catch(() => {});
  if (figureVideo.style.display !== 'none') figureVideo.play().catch(() => {});
  
  // 渲染帧
  renderRecordingFrame(bgVideo, bgImage, bgImgElement, figureVideo, figureImage, fgImgElement, rw, rh);
  
  // 音频结束时停止录制
  const onEnded = () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    audioElement.removeEventListener('ended', onEnded);
  };
  audioElement.addEventListener('ended', onEnded);
}

function renderRecordingFrame(bgVideo, bgImage, bgImgElement, figureVideo, figureImage, fgImgElement, rw, rh) {
  if (!isRecording) return;
  
  const ctx = recordingCtx;
  const currentTime = audioElement.currentTime;
  const total = recordingDuration || 1;
  const progress = Math.min(currentTime / total * 100, 100);
  
  document.getElementById('recordingProgressFill').style.width = progress + '%';
  document.getElementById('recordingProgressText').textContent = Math.floor(progress) + '%';
  
  ctx.clearRect(0, 0, rw, rh);
  
  // 背景
  if (bgVideo.style.display !== 'none' && bgVideo.readyState >= 2) {
    ctx.drawImage(bgVideo, 0, 0, rw, rh);
  } else if (bgImgElement) {
    ctx.drawImage(bgImgElement, 0, 0, rw, rh);
  } else if (bgImage.style.display !== 'none' && bgImage.complete) {
    ctx.drawImage(bgImage, 0, 0, rw, rh);
  } else {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, rw, rh);
  }
  
  // 半透明蒙版
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, rw, rh);
  
  // 文字
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 8;
  
  const centerX = rw / 2;
  let currentY = rh * 0.25;
  
  // 歌名
  ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(document.getElementById('songTitle').value || '歌名', centerX, currentY);
  currentY += 50;
  
  // 制作信息
  const lyr = document.getElementById('creditsLyrics').value;
  const mus = document.getElementById('creditsMusic').value;
  let credits = '';
  if (lyr) credits += '词：' + lyr;
  if (mus) credits += (credits ? '  ' : '') + '曲：' + mus;
  if (credits) {
    ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.globalAlpha = 0.85;
    ctx.fillText(credits, centerX, currentY);
    ctx.globalAlpha = 1;
    currentY += 30;
  }
  
  // 人物
  if (figureVideo.style.display !== 'none' && figureVideo.readyState >= 2) {
    const fw = figureVideo.videoWidth;
    const fh = figureVideo.videoHeight;
    const maxH = rh * 0.22;
    const scale = Math.min(maxH / fh, (rw * 0.6) / fw);
    ctx.drawImage(figureVideo, centerX - (fw * scale) / 2, currentY, fw * scale, fh * scale);
    currentY += fh * scale + 20;
  } else if (fgImgElement) {
    const fw = fgImgElement.width;
    const fh = fgImgElement.height;
    const maxH = rh * 0.22;
    const scale = Math.min(maxH / fh, (rw * 0.6) / fw);
    ctx.drawImage(fgImgElement, centerX - (fw * scale) / 2, currentY, fw * scale, fh * scale);
    currentY += fh * scale + 20;
  }
  
  // 歌词
  const { lines } = getVisibleLyrics(currentTime);
  ctx.shadowBlur = 4;
  lines.forEach(line => {
    if (line.isActive) {
      ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.globalAlpha = 1;
    } else {
      ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.5;
    }
    ctx.fillText(line.text, centerX, currentY);
    currentY += 28;
  });
  ctx.globalAlpha = 1;
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  
  recordingAnimationId = requestAnimationFrame(() => {
    renderRecordingFrame(bgVideo, bgImage, bgImgElement, figureVideo, figureImage, fgImgElement, rw, rh);
  });
}

function cancelRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  if (recordingAnimationId) {
    cancelAnimationFrame(recordingAnimationId);
    recordingAnimationId = null;
  }
  audioElement.pause();
  document.getElementById('previewBgVideo')?.pause();
  document.getElementById('previewFigureVideo')?.pause();
  document.getElementById('recordingModal').style.display = 'none';
  document.getElementById('downloadBtn').disabled = false;
  document.getElementById('processingText').style.display = 'none';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  isRecording = false;
  recordingChunks = [];
  showStatus('info', '已取消录制');
}

// ========== 重置 ==========
function resetForm() {
  if (isRecording) cancelRecording();
  
  document.getElementById('songTitle').value = '活该我盛开';
  document.getElementById('creditsLyrics').value = '山岭在逃';
  document.getElementById('creditsMusic').value = '山岭在逃';
  document.getElementById('audioUrl').value = '';
  
  // 重置文件
  Object.keys(fileBase64).forEach(k => fileBase64[k] = null);
  document.querySelectorAll('input[type="file"]').forEach(i => i.value = '');
  document.querySelectorAll('.file-status').forEach(el => {
    el.className = 'file-status';
    el.textContent = '';
  });
  
  document.getElementById('previewBgVideo').style.display = 'none';
  document.getElementById('previewBgImage').style.display = 'none';
  document.getElementById('previewBgFallback').style.display = 'block';
  document.getElementById('previewFigureVideo').style.display = 'none';
  document.getElementById('previewFigureImage').style.display = 'none';
  
  audioElement.src = '';
  pausePreview();
  document.getElementById('audioSeekBar').value = 0;
  document.getElementById('currentTime').textContent = '00:00';
  document.getElementById('totalTime').textContent = '00:00';
  
  updatePreview();
  setTimeout(fitToScreen, 100);
  showStatus('success', '✅ 已恢复默认值');
}
